# AWS Amplify Hosting build spec for the Next.js frontend in this npm-workspaces
# monorepo. Connect the repo in the Amplify console, set the app root to
# `apps/web`, set the Node.js version to 20 (or 22), and add the environment
# variables from the deployment plan (at minimum WORKBENCH_API_URL).
#
# Amplify runs these phases from the configured app root, so `npm ci --prefix ../..`
# installs the whole workspace from the repo root.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefix ../..
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
